services:
  ph-web:
    build: .
    container_name: ph-control-web
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://ph-database:27017/ph_control_db
      - SECRET_KEY=dev-secret-key-change-in-production-ph-control-2024
      - PORT=5003
      - DEBUG=True
      # Configuración de inicialización
      - CREATE_SAMPLE_DATA=true
      - SKIP_INIT=false
    depends_on:
      - ph-database
    volumes:
      - .:/app
      - ph_uploads:/app/uploads
    networks:
      - ph-network

  ph-database:
    image: mongo:7.0
    container_name: ph-control-database
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=ph_control_db
    volumes:
      - ph_mongo_data:/data/db
      - ./init_mongo.py:/docker-entrypoint-initdb.d/init_mongo.py:ro
    ports:
      - "27017:27017"
    networks:
      - ph-network

  ph-redis:
    image: redis:7-alpine
    container_name: ph-control-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - ph-network

volumes:
  ph_mongo_data:
  ph_uploads:

networks:
  ph-network:
    driver: bridge