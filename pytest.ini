[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configuración de cobertura
addopts = --cov=. --cov-report=term --cov-report=html

# Excluir directorios de la cobertura
omit =
    tests/*
    venv/*
    env/*
    .venv/*
    .env/*
    */site-packages/*

# Configuración de entorno para pruebas
env =
    FLASK_ENV=testing
    TESTING=True
    DATABASE_URL=postgresql://phcontrol:phcontrol123@ph-database:5432/phcontrol_test
    SECRET_KEY=test-secret-key
    DEBUG=False