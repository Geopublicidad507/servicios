{% extends "base.html" %}

{% block title %}Crear Ticket - PH Control{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Crear Ticket</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="{{ url_for('communication.tickets') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver a tickets
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label for="title" class="form-label">Título *</label>
                <input type="text" class="form-control" id="title" name="title" required>
                <div class="form-text">Describe brevemente el asunto del ticket.</div>
            </div>
            
            <div class="mb-3">
                <label for="category" class="form-label">Categoría *</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="">Seleccione una categoría</option>
                    <option value="maintenance">Mantenimiento</option>
                    <option value="complaint">Queja</option>
                    <option value="request">Solicitud</option>
                    <option value="suggestion">Sugerencia</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="priority" class="form-label">Prioridad</label>
                <select class="form-select" id="priority" name="priority">
                    <option value="low">Baja</option>
                    <option value="medium" selected>Media</option>
                    <option value="high">Alta</option>
                    <option value="urgent">Urgente</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">Descripción *</label>
                <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                <div class="form-text">Proporciona todos los detalles relevantes para que podamos atender tu solicitud.</div>
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-outline-secondary" onclick="history.back()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Crear ticket</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
