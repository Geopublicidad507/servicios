{% extends "base.html" %}

{% block title %}Nueva Propiedad - Admin{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Nueva Propiedad</h1>
        <a href="{{ url_for('admin.properties') }}" class="btn btn-secondary btn-sm">
            <i class="fas fa-arrow-left fa-sm text-white-50"></i> Volver
        </a>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Información de la Propiedad</h6>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name">Nombre de la Propiedad *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="code">Código *</label>
                            <input type="text" class="form-control" id="code" name="code" 
                                   placeholder="Ej: PH001" required>
                            <small class="form-text text-muted">Código único para identificar la propiedad</small>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Dirección *</label>
                    <textarea class="form-control" id="address" name="address" rows="2" required></textarea>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="total_units">Total de Unidades *</label>
                            <input type="number" class="form-control" id="total_units" name="total_units" 
                                   min="1" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="monthly_fee">Cuota Mensual (USD)</label>
                            <input type="number" class="form-control" id="monthly_fee" name="monthly_fee" 
                                   step="0.01" min="0" placeholder="0.00">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="admin_id">Administrador *</label>
                            <select class="form-control" id="admin_id" name="admin_id" required>
                                <option value="">Seleccionar administrador...</option>
                                {% for admin in admins %}
                                <option value="{{ admin.id }}">
                                    {{ admin.full_name }} ({{ admin.role.replace('_', ' ').title() }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save mr-2"></i> Crear Propiedad
                    </button>
                    <a href="{{ url_for('admin.properties') }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
